name: backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrations apply cleanly and every table has RLS
        run: npm run db:check
      - name: OpenAPI spec is up to date
        run: npx tsx scripts/openapi.ts --check
      - name: Unit, HTTP and release-blocking SQL tests
        run: npm test
      - name: Docker image builds
        run: docker build -t warrantra-backend .
