# Render blueprint (optional): API web service + background worker from the same Docker image.
# Create via Render Dashboard -> Blueprints -> New, pointing at this repo. Fill secrets in the dashboard
# (sync: false). Any Docker host works the same way: run the image twice with the two commands.
services:
  - type: web
    name: warrantra-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars: &env
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HASH_PEPPER
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.4-mini
      - key: PUSH_PROVIDER
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INBOUND_WEBHOOK_PASSWORD
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
  - type: worker
    name: warrantra-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/workers/run.js
    envVars: *env
